<script>
/* ================= content ================= */
const DARES={
mild:[
"Give a 30-second backstory for your costume, fully in character.",
"Do your best horror-movie scream. If nobody flinches, drink.",

"Slow-dance with {o} for the next song. Fully committed.",

"Hot take: who here is most likely to be the killer? They decide if you drink."

unhinged:[
"Two truths and a lie, all about tonight. Wrong guessers drink.",
"Let {o} pick your next drink. Finish it.",
"Take a shot without using your hands.",
"Lead the room in a 30-second zombie dance. Anyone who doesn't join drinks.",
"Make a toast to the night. If the room doesn't cheer, take a shot.",
"Let the room write a 3-word caption for your next story. Post it.",
"Swap entire costumes with {o} for 15 minutes.",
"Stand on a chair and give a 30-second villain monologue.",
"Everyone points at the drunkest person here. You and the winner take a shot together.",
"Call a friend on speaker and convince them you've just seen a ghost.",
"Finish your drink. That's the dare.",
"Who here would you trust to help you bury a body? Who wouldn't you? Answer or take two.",
"Hold a plank until {o} finishes their drink.",
"Pick two people to arm-wrestle. Loser takes a shot, and you take one with them.",
"Freestyle rap about {o}'s costume for 30 seconds.",
"Give {o} your phone for 60 seconds, unlocked. They can do one harmless thing."
]};
const HOT=[
"die first in a horror movie","accidentally summon a demon","be the killer and get away with it","cry before the night is over",
"get kicked out of a haunted house","still be here at 4am","text an ex tonight","marry a vampire",
"survive the zombie apocalypse the longest","secretly be a witch","scream first at a jump scare","spend the most on a costume and still lose",
"befriend the ghost instead of running","start a cult","lose their phone tonight","trip while running from the killer",
"split the group up to cover more ground","go investigate the noise in the basement","be found asleep in the bathtub",
"have the most cursed search history","sell their soul for free drinks","get possessed and not notice","hook up at this party",
"read the forbidden book out loud","eat all the Halloween candy before the kids show up"];
const METHODS=[
"Get them to say the word “candy”.","Get them to take something from your hand.","Get them to clink glasses with you.",
"Get them to take a selfie with you.","Get them to tell you what time it is.","Get them to high-five you.",
"Get them to taste your food or drink.","Get them to compliment your costume out loud."];
const CATS=[
{id:"scary",label:"Scariest",pts:3,on:true},{id:"funny",label:"Funniest",pts:3,on:true},
{id:"lazy",label:"Laziest Effort",pts:0,on:false},{id:"best",label:"Best Costume",pts:5,on:true,fixed:true}];
const LVL={mild:"Warm-up",spicy:"Spicy",unhinged:"Unhinged"};

/* ================= utils ================= */
const seal=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).split("").reverse().join("");
const unseal=(s,d)=>{try{return s?JSON.parse(decodeURIComponent(escape(atob(s.split("").reverse().join(""))))):d}catch(e){return d}};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const uid=()=>"p"+Math.random().toString(36).slice(2,9);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
const defaults=()=>({created:Date.now(),players:{},cats:JSON.parse(JSON.stringify(CATS)),killerCount:1,
  reveal:null,killer:{status:"off",round:0,seen:[],dead:[],result:null},points:{},titles:{},dareCount:{},dareLevel:"auto",current:null});

/* ================= app state ================= */
const hash=location.hash.replace(/^#/,"");
const MODE=hash==="tv"?"tv":"phone";
if(hash==="host-"+HOST_KEY)ls.set("gs-host-"+PARTY_ID,"1");
const IS_HOST=(hash==="host-"+HOST_KEY||ls.get("gs-host-"+PARTY_ID)==="1")&&MODE!=="tv";
let ME=ls.get("gs-me-"+PARTY_ID);
const S={main:null,loaded:false,ballots:[],acc:[],hot:[],role:null};
const ui={tab:"live",flow:null,draft:{},accPick:null,editPts:false,revealShown:null,hotUsed:[],used:{mild:[],spicy:[],unhinged:[]}};
let FS,PARTY,FV;

const players=()=>S.main?Object.entries(S.main.players||{}).map(([id,p])=>({id,...p})).sort((a,b)=>(a.joined||0)-(b.joined||0)):[];
const ids=()=>players().map(p=>p.id);
const nm=id=>(S.main&&S.main.players&&S.main.players[id]?S.main.players[id].name:"Someone");
const activeCats=()=>(S.main.cats||[]).filter(c=>c.on);
const ballotCount=()=>S.ballots.filter(b=>S.main.players[b.id]).length;
const myBallot=()=>{const b=S.ballots.find(b=>b.id===ME);return b?unseal(b.s,null):null};
const K=()=>S.main.killer||defaults().killer;
const isOut=(id,g)=>!!(S.main.players[id]&&S.main.players[id].out&&S.main.players[id].out[g]);
const inGame=g=>ids().filter(id=>!isOut(id,g));
const kPlayers=()=>{const k=K();return (k.players&&k.players.length?k.players:ids()).filter(id=>S.main.players[id])};
const GAMES={dares:"Dares",hot:"Hot Seat",killer:"Who's the Killer"};
const accThisRound=()=>{const kp=kPlayers();return S.acc.filter(a=>a.round===K().round&&kp.includes(a.id))};
const hotThisQ=()=>{const c=S.main.current;return c&&c.type==="hot"?S.hot.filter(h=>h.qid===c.qid&&S.main.players[h.id]&&!isOut(h.id,"hot")&&!isOut(h.pick,"hot")):[]};
function level(){const L=S.main.dareLevel||"auto";if(L!=="auto")return L;const d=new Date(),h=d.getHours(),t=(h<12?h+24:h)*60+d.getMinutes();return t<23*60+30?"mild":t<25*60?"spicy":"unhinged"}

/* ================= db writes ================= */
const up=o=>PARTY.update(o).catch(err);
function err(e){console.error(e);toast("Couldn't save. Check your connection and try again.")}
async function join(name){
  name=name.trim().slice(0,24);if(!name)return;
  if(players().some(p=>p.name.toLowerCase()===name.toLowerCase())){toast("That name's taken. Tap it above if it's you.");return}
  const id=uid();await PARTY.update({["players."+id]:{name,joined:Date.now()}}).catch(err);
  ME=id;ls.set("gs-me-"+PARTY_ID,id);ui.tab="live";render();
}
function claim(id){ME=id;ls.set("gs-me-"+PARTY_ID,id);ui.tab="live";render()}

async function hostReveal(){
  const res=activeCats().map(c=>{const t={};
    S.ballots.forEach(b=>{if(!S.main.players[b.id])return;const bal=unseal(b.s,{});const id=bal[c.id];if(id&&S.main.players[id]&&id!==b.id)t[id]=(t[id]||0)+1});
    const rank=Object.entries(t).map(([id,v])=>({id,v})).sort((a,b)=>b.v-a.v);const top=rank.length?rank[0].v:0;
    return {id:c.id,label:c.label,pts:c.pts,rank,win:rank.filter(x=>x.v===top&&top>0).map(x=>x.id)}});
  res.sort((a,b)=>(a.id==="best")-(b.id==="best"));
  const o={reveal:{results:res,step:0,done:false,nonce:Date.now()}},add={};
  res.forEach(r=>r.win.forEach(id=>{add[id]=(add[id]||0)+r.pts}));
  Object.entries(add).forEach(([id,n])=>{if(n)o["points."+id]=FV.increment(n)});
  return up(o);
}
async function hostAssign(){
  const all=shuffle(inGame("killer"));if(all.length<4){toast("Need at least 4 guests playing Killer");return}const n=Math.min(S.main.killerCount||1,Math.max(1,Math.floor(all.length/3))),killers=all.slice(0,n),ms=shuffle(METHODS),round=(K().round||0)+1;
  const b=FS.batch();
  all.forEach(id=>{const ki=killers.indexOf(id);
    b.set(PARTY.collection("roles").doc(id),{round,s:seal(ki>=0?{k:true,m:ms[ki],partners:killers.filter(x=>x!==id)}:{k:false})})});
  b.update(PARTY,{killer:{status:"live",round,players:all,seen:[],dead:[],result:null}});
  await b.commit().catch(err);toast("Roles sent. Everyone check your phone.");
}
async function hostUnmask(){
  const k=K(),snap=await PARTY.collection("roles").get().catch(err);if(!snap)return;
  const killers=[];snap.forEach(d=>{const x=d.data();if(x.round===k.round&&unseal(x.s,{}).k&&S.main.players[d.id])killers.push(d.id)});
  const acc=accThisRound(),t={};acc.forEach(a=>{t[a.pick]=(t[a.pick]||0)+1});
  const top=Math.max(0,...Object.values(t)),topIds=Object.keys(t).filter(id=>t[id]===top&&top>0);
  const caught=topIds.length===1&&killers.includes(topIds[0]);
  const right=acc.filter(a=>killers.includes(a.pick)&&!killers.includes(a.id)).map(a=>a.id);
  const add={};right.forEach(id=>add[id]=(add[id]||0)+3);
  const bodies=(k.dead||[]).length;killers.forEach(id=>add[id]=(add[id]||0)+2*bodies+(caught?0:5));
  const o={"killer.status":"revealed","killer.result":{killers,top:topIds,caught,right,bodies,nonce:Date.now()}};
  Object.entries(add).forEach(([id,n])=>{if(n)o["points."+id]=FV.increment(n)});
  return up(o);
}
function hostDraw(){
  const lv=level(),pool=DARES[lv];let used=ui.used[lv];if(used.length>=pool.length)used=ui.used[lv]=[];
  const idx=shuffle(pool.map((_,i)=>i).filter(i=>!used.includes(i)))[0];used.push(idx);
  const all=inGame("dares");if(all.length<2){toast("Need at least 2 guests playing Dares");return}
  const dc=S.main.dareCount||{},cur=S.main.current,min=Math.min(...all.map(id=>dc[id]||0));
  const cand=all.filter(id=>(dc[id]||0)===min&&!(cur&&cur.pid===id));
  const pid=rnd(cand.length?cand:all),o=rnd(all.filter(id=>id!==pid));
  return up({current:{type:"dare",pid,lvl:lv,text:pool[idx].replace(/\{o\}/g,nm(o)),at:Date.now()},["dareCount."+pid]:FV.increment(1)});
}
function hostHot(){let pool=HOT.map((_,i)=>i).filter(i=>!ui.hotUsed.includes(i));if(!pool.length){ui.hotUsed=[];pool=HOT.map((_,i)=>i)}

function hostHotReveal(){const c=S.main.current,t={};hotThisQ().forEach(h=>{t[h.pick]=(t[h.pick]||0)+1});

async function clearCol(name){const s=await PARTY.collection(name).get();let b=FS.batch(),n=0;

  <div class="panel stack" style="align-items:center;text-align:center"><div class="award">Guests scan to join</div><div class="qr" id="qr" style="width:200px"></div><div class="mono">${esc(joinUrl())}</div>
  <p class="muted" style="margin:0;font-size:14px">On the TV, open the same link with <b style="color:var(--bone)">#tv</b> on the end.</p></div>
  <h3>Guests (${ps.length})</h3><div class="panel">${ps.length?`<div class="lb">${ps.map(p=>`<div class="r"><span class="n">·</span><span class="nm">${esc(p.name)}${p.id===ME?" <span class=\"muted\">(you)</span>":""}${Object.keys(GAMES).filter(g=>isOut(p.id,g)).length?`<small>Sitting out: ${Object.keys(GAMES).filter(g=>isOut(p.id,g)).map(g=>GAMES[g]).join(", ")}</small>`:""}</span><button class="ibtn chip" style="padding:6px 10px" data-act="kick" data-id="${p.id}">Remove</button></div>`).join("")}</div>`:`<p class="muted" style="margin:0">Nobody's joined yet. Put the QR code up.</p>`}</div>
  <h3>Costume awards</h3><div class="panel">${(S.main.cats||[]).map(c=>`<label class="toggle" for="cat-${c.id}"><span><b>${esc(c.label)}</b> <span class="muted">· ${c.pts} pts${c.fixed?" · always on":""}</span></span><input type="checkbox" id="cat-${c.id}" data-cat="${c.id}" ${c.on?"checked":""} ${c.fixed||locked?"disabled":""}></label>`).join("")}${locked?`<p class="muted" style="margin:8px 0 0;font-size:14px">Locked because ballots are already in.</p>`:""}</div>
  <h3>Reset</h3><div class="stack">${hold("resetgames","Reset games, keep guests","ghost","Hold 1.3s · clears votes, points, killer")}${hold("wipe","Wipe everything","red","Hold 1.3s · everyone has to rejoin")}</div>
  <p class="muted" style="margin-top:16px;font-size:14px">Want to play on a second device as host? Open your host link there too.</p>`;
}
function vTV(){
  const N=ids().length,c=S.main.current,k=K();
  let now=`<div class="card"><div class="award" style="text-align:left">Up next</div><div class="what muted">Dares and hot-seat questions appear here.</div></div>`;
  if(c&&c.type==="dare")now=`<div class="card"><span class="lvl ${c.lvl}">${LVL[c.lvl]} dare</span><div class="who">${esc(nm(c.pid))}</div><div class="what">${esc(c.text)}</div></div>`;
  if(c&&c.type==="hot")now=`<div class="card"><div class="award" style="text-align:left">Who's most likely to…</div><div class="what">${esc(c.q)}?</div>${c.win?`<div class="who">${c.win.map(id=>esc(nm(id))).join(" & ")||"Nobody voted"}</div><div class="runners">${(c.tally||[]).map(x=>`${esc(nm(x.id))} ${x.v}`).join(" · ")}</div>`:`<div class="stat"><b>${hotThisQ().length}/${inGame("hot").length}</b>voted on their phones</div>`}</div>`;
  let kill="";
  if(k.status==="live")kill=`<div class="stat"><b>${(k.dead||[]).length}</b>☠ ${(k.dead||[]).slice(-4).map(d=>esc(nm(d.id))).join(", ")||"no bodies yet"}</div>`;
  if(k.status==="accusing")kill=`<div class="stat"><b>${accThisRound().length}/${kPlayers().length}</b>accusations in</div>`;
  if(k.status==="revealed"&&k.result)kill=killerResult(k.result);
  const votes=S.main.reveal&&S.main.reveal.done?"":`<div class="stat"><b>${ballotCount()}/${N}</b>costume ballots sealed</div>`;
  return `<div class="tv"><div class="stack" style="min-width:0"><div class="brand">Graveyard Shift<small>Live leaderboard</small></div><div class="panel">${N?lbHtml(false):`<p class="muted" style="margin:0">Scan the code to join.</p>`}</div>
  <div class="join"><div class="qr" id="qr"></div><div><div class="award">Join the party</div><p>Scan with your phone camera</p></div></div></div>
  <div class="stack" style="min-width:0;justify-content:center">${now}${votes}${kill}</div></div>`;
}

/* ================= render ================= */
let qrNode=null;
function drawQR(){const el=document.getElementById("qr");if(!el||!window.QRCode)return;
  if(!qrNode){qrNode=document.createElement("div");try{new QRCode(qrNode,{text:joinUrl(),width:400,height:400,colorDark:"#17101a",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M})}catch(e){}}
  if(qrNode.parentNode!==el){el.innerHTML="";el.appendChild(qrNode)}}
function put(el,h){if(!el||el._h===h)return false;el._h=h;el.innerHTML=h;return true}
function setup(msg){document.getElementById("main").innerHTML=`<div class="panel stack"><h2>Almost alive</h2><p>${msg}</p></div>`}
function render(){if(holdEl||peeking){pendingRender=true;return}pendingRender=false;try{renderInner()}catch(e){console.error(e);const m=document.getElementById("main");if(m)m._h=null;if(m)m.innerHTML=`<div class="panel stack"><h2>Something broke</h2><p class="mono muted">${esc(e&&e.message)} · v4</p><button class="btn ghost" onclick="location.reload()">Reload</button></div>`}}
function renderInner(){
  if(!S.loaded)return;
  const main=document.getElementById("main"),layer=document.getElementById("layer"),tabs=document.getElementById("tabs");
  if(!S.main){
    tabs.hidden=true;
    put(main,IS_HOST?`<div class="panel stack"><h2>Open the party</h2><p class="muted">This creates the party so guests can join.</p><button class="btn" data-act="create">Open the crypt</button></div>`
      :`<div class="panel stack"><h2>Not open yet</h2><p class="muted">The host hasn't opened the party. Try again in a bit.</p></div>`);
    put(layer,"");return;
  }
  if(MODE==="tv"){document.body.classList.add("tvmode");put(document.getElementById("tvroot"),vTV());renderOverlay();drawQR();return}
  const meName=ME&&S.main.players[ME]?S.main.players[ME].name:null;
  document.getElementById("me").innerHTML=meName?`playing as<b>${esc(meName)}</b>${IS_HOST?`<span class="hostpill">HOST</span>`:""}`:(IS_HOST?`<span class="hostpill">HOST</span>`:"");
  if(!meName&&ui.tab!=="host"){tabs.hidden=!IS_HOST;put(main,vJoin());renderTabs();renderOverlay();return}
  tabs.hidden=false;renderTabs();
  const keep=document.activeElement&&document.activeElement.tagName==="INPUT"?document.activeElement.id:null;
  const v={live:vLive,vote:vVote,killer:vKiller,board:vBoard,host:vHost}[ui.tab]||vLive;
  put(main,meName||ui.tab==="host"?v():vJoin());
  if(keep){const i=document.getElementById(keep);i&&i.focus()}
  renderOverlay();drawQR();
}
function renderTabs(){
  const k=K(),c=S.main.current,mine=myBallot();
  const t=[["live","🃏","Now",c&&!(c.type==="hot"&&(c.win||S.hot.some(h=>h.id===ME&&h.qid===c.qid)))&&ui.tab!=="live"],
    ["vote","👑","Costumes",!mine&&!(S.main.reveal)],["killer","🔪","Killer",(k.status==="live"&&S.role&&S.role.round===k.round&&!(k.seen||[]).includes(ME))||(k.status==="accusing"&&!S.acc.some(a=>a.id===ME&&a.round===k.round))],["board","🏆","Board",false]];
  if(IS_HOST)t.push(["host","⚙︎","Host",false]);
  const meIn=ME&&S.main.players[ME];
  put(document.getElementById("tabsin"),t.map(([id,i,l,dot])=>`<button data-act="tab" data-tab="${id}" aria-current="${ui.tab===id?"page":"false"}" ${!meIn&&id!=="host"?"style=\"opacity:.5\"":""}><b>${i}</b>${l}${dot&&meIn?`<span class="dot"></span>`:""}</button>`).join(""));
}
function renderOverlay(){
  const layer=document.getElementById("layer"),R=S.main.reveal;
  if(R&&!R.done&&R.results&&R.results[R.step]){put(layer,`<div class="ov">${fReveal()}</div>`);runCountdown();return}
  const kr=K().result;
  if(MODE==="tv"&&K().status==="revealed"&&kr&&ui.unmaskSeen!==kr.nonce&&Date.now()-kr.nonce<20000){
    put(layer,`<div class="ov"><div class="inner">${killerResult(kr)}</div></div>`);clearTimeout(ui.unT);ui.unT=setTimeout(()=>{ui.unmaskSeen=kr.nonce;renderOverlay()},15000);return}
  put(layer,"");
}
let cdKey=null;
function runCountdown(){const R=S.main.reveal,key=R.step+":"+R.nonce;if(ui.revealShown===key||cdKey===key)return;cdKey=key;
  let n=3;const tick=()=>{if(cdKey!==key)return;const el=document.getElementById("cd");if(n>0){if(el){el.textContent=n;el.style.animation="none";void el.offsetWidth;el.style.animation=""}n--;setTimeout(tick,1000)}else{ui.revealShown=key;cdKey=null;render()}};tick()}

/* ================= actions ================= */
const holdActs={
  reveal:hostReveal,assign:hostAssign,unmask:hostUnmask,
  accuse:()=>up({"killer.status":"accusing"}),
  killreset:()=>up({"killer.status":"off","killer.result":null,"killer.dead":[],"killer.seen":[]}),
  die:()=>{if(!(K().dead||[]).some(d=>d.id===ME))up({"killer.dead":FV.arrayUnion({id:ME,at:Date.now()})}).then(()=>toast("Rest in pieces. Take a drink."))},
  resetgames:()=>hostReset(true),wipe:()=>hostReset(false)
};
const acts={
  tab(el){ui.tab=el.dataset.tab;ui.flow=null;ui.draft={};ui.accPick=null;render();scrollTo(0,0)},
  create(){PARTY.set(defaults()).catch(err)},
  claim(el){claim(el.dataset.id)},
  pick(el){ui.draft[el.dataset.cat]=el.dataset.id;render()},
  editvote(){ui.flow="editvote";ui.draft=Object.assign({_init:1},myBallot()||{});render()},
  canceledit(){ui.flow=null;ui.draft={};render()},
  sealvote(){if(S.main.reveal){toast("Voting is locked");return}const p={};activeCats().forEach(c=>p[c.id]=ui.draft[c.id]);
    PARTY.collection("ballots").doc(ME).set({s:seal(p),at:Date.now()}).then(()=>{ui.flow=null;toast("Ballot sealed 🕯️")}).catch(err)},
  nextaward(){up({"reveal.step":S.main.reveal.step+1})},
  endreveal(){up({"reveal.done":true})},
  replay(){up({"reveal.done":false,"reveal.step":0,"reveal.nonce":Date.now()})},
  pickacc(el){ui.accPick=el.dataset.id;render()},
  sealacc(){if(!ui.accPick)return;PARTY.collection("acc").doc(ME).set({pick:ui.accPick,round:K().round,at:Date.now()}).then(()=>{ui.accPick=null;toast("Accusation sealed 🔒")}).catch(err)},
  hotpick(el){const c=S.main.current;if(!c||c.type!=="hot"||c.win||isOut(ME,"hot"))return;PARTY.collection("hotvotes").doc(ME).set({qid:c.qid,pick:el.dataset.id,at:Date.now()}).catch(err)},
  lvl(el){up({dareLevel:el.dataset.l})},
  draw:hostDraw,
  daredone(){const c=S.main.current;up({["points."+c.pid]:FV.increment(1)}).then(()=>{toast(nm(c.pid)+" +1");hostDraw()})},
  darechicken(){toast(nm(S.main.current.pid)+" drinks twice 🍺");hostDraw()},
  hotnew:hostHot,hotreveal:hostHotReveal,
  clearcur(){up({current:null})},
  opt(el){const g=el.dataset.g,out=!isOut(ME,g);up({["players."+ME+".out."+g]:out}).then(()=>toast(out?"You're sitting out of "+GAMES[g]:"Welcome back to "+GAMES[g]))},
  editpts(){ui.editPts=!ui.editPts;render()},
  pm(el){up({["points."+el.dataset.id]:FV.increment(+el.dataset.n)})},
  kick(el){const id=el.dataset.id;if(ui.kickArm!==id){ui.kickArm=id;el.textContent="Tap again";setTimeout(()=>{if(ui.kickArm===id){ui.kickArm=null;render()}},3000);return}
    ui.kickArm=null;up({["players."+id]:FV.delete(),["points."+id]:FV.delete()});PARTY.collection("ballots").doc(id).delete().catch(()=>{})}
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el||el.disabled)return;const f=acts[el.dataset.act];if(f)f(el)});
document.addEventListener("submit",e=>{if(e.target.id==="joinf"){e.preventDefault();join(document.getElementById("joinname").value)}});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.cat){const cats=S.main.cats.map(c=>c.id===t.dataset.cat?{...c,on:t.checked}:c);up({cats})}
  if(t.id==="kc")up({killerCount:+t.value})});
let holdT=null,holdEl=null,peeking=false,pendingRender=false;
document.addEventListener("pointerdown",e=>{
  const pk=e.target.closest("[data-peek]");
  if(pk){peeking=true;pk.classList.add("on");pk.querySelector("#peekoff").hidden=true;pk.querySelector("#peekon").hidden=false;try{pk.setPointerCapture(e.pointerId)}catch(_){}
    const k=K();if(!(k.seen||[]).includes(ME))up({"killer.seen":FV.arrayUnion(ME)});return}
  const h=e.target.closest("[data-hold]");if(!h||h.disabled)return;holdEl=h;h.classList.add("holding");
  holdT=setTimeout(()=>{h.classList.remove("holding");holdEl=null;holdT=null;const f=holdActs[h.dataset.hold];if(f)f();if(pendingRender)render()},1300)});
function endHold(){const was=peeking||!!holdEl;peeking=false;const pk=document.getElementById("peek");if(pk&&pk.classList.contains("on")){pk.classList.remove("on");pk.querySelector("#peekoff").hidden=false;pk.querySelector("#peekon").hidden=true}
  if(holdT){clearTimeout(holdT);holdT=null}if(holdEl){holdEl.classList.remove("holding");holdEl=null}if(was&&pendingRender)render()}
["pointerup","pointercancel"].forEach(t=>document.addEventListener(t,endHold));
document.addEventListener("contextmenu",e=>{if(e.target.closest("[data-hold],[data-peek]"))e.preventDefault()});
document.addEventListener("keydown",e=>{const h=e.target.closest&&e.target.closest("[data-hold]");if(h&&!h.disabled&&(e.key==="Enter"||e.key===" ")){e.preventDefault();const f=holdActs[h.dataset.hold];f&&f()}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)endHold()});

/* ================= boot ================= */
const DIAG=[];
["error","warn"].forEach(k=>{const o=console[k];console[k]=function(...a){try{DIAG.push(a.map(x=>x&&x.message?x.code+": "+x.message:String(x)).join(" ").slice(0,220))}catch(e){}return o.apply(console,a)}});
window.addEventListener("error",e=>{DIAG.push("Script error: "+(e.message||"unknown")+" @"+(e.lineno||"?"));if(!S.loaded){const m=document.getElementById("main");if(m)m.innerHTML=`<div class="panel stack"><h2>Something broke</h2><p class="mono muted">${esc(DIAG[DIAG.length-1])}</p></div>`}});
function boot(){
  if(!FIREBASE_CONFIG.projectId){S.loaded=true;setup("The Firebase settings haven't been added to this file yet.");return}
  if(!window.firebase){setup("Couldn't load the game engine. Check your internet connection and refresh.");return}
  firebase.initializeApp(FIREBASE_CONFIG);FS=firebase.firestore();
  try{FS.settings({experimentalForceLongPolling:true,merge:true})}catch(e){}
  FV=firebase.firestore.FieldValue;PARTY=FS.collection("parties").doc(PARTY_ID);
  setTimeout(()=>{if(S.loaded)return;const last=DIAG.slice(-3).map(esc).join("<br>")||"No error reported.";
    document.getElementById("main").innerHTML=`<div class="panel stack"><h2>Still summoning…</h2><p>The party database isn't answering. Screenshot this and send it to Claude.</p><p class="mono muted">${navigator.onLine?"Phone is online":"Phone is offline"} · v4<br>${last}</p><button class="btn ghost" onclick="location.reload()">Try again</button></div>`},12000);
  PARTY.onSnapshot(s=>{S.main=s.exists?s.data():null;S.loaded=true;
    if(S.main&&ME&&!S.main.players[ME]&&S.main.created&&s.metadata&&!s.metadata.fromCache){/* removed or wiped */}
    if(!S.main||!S.main.reveal)ui.revealShown=null;
    render()},e=>{console.error(e);S.loaded=true;setup("Can't reach the party database. If you're the host, check the Firestore rules allow reads and writes.")});
  const col=(name,key)=>PARTY.collection(name).onSnapshot(q=>{S[key]=q.docs.map(d=>({id:d.id,...d.data()}));render()},e=>console.error(e));
  col("ballots","ballots");col("acc","acc");col("hotvotes","hot");
  if(ME&&MODE!=="tv")PARTY.collection("roles").doc(ME).onSnapshot(d=>{S.role=d.exists?d.data():null;render()},()=>{});
  if(MODE==="tv"){try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{})}catch(e){}}
  setInterval(()=>{if(MODE==="tv"||ui.tab==="live")render()},60000);
}
/* roles listener must follow identity changes */
const _claim=claim;claim=function(id){_claim(id);if(PARTY&&MODE!=="tv")PARTY.collection("roles").doc(id).onSnapshot(d=>{S.role=d.exists?d.data():null;render()},()=>{})};
const _join=join;join=async function(n){const before=ME;await _join(n);if(ME&&ME!==before&&PARTY)PARTY.collection("roles").doc(ME).onSnapshot(d=>{S.role=d.exists?d.data():null;render()},()=>{})};
boot();
</script>
</body>
